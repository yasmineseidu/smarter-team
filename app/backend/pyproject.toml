[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smarter-team"
version = "0.1.0"
description = "Multi-Agent AI Agency Automation"
readme = {text = "Multi-Agent AI Agency Automation System", content-type = "text/plain"}
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Smarter Team"}
]
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Task Queue
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    # HTTP Client
    "httpx>=0.27.0",
    # AI/ML
    "anthropic>=0.37.0",
    # "claude-agent-sdk>=0.1.0",  # Install when available
    # Vector Database
    "pinecone-client>=3.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9.11",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",

    # Linting & Formatting
    "ruff>=0.7.0",
    "mypy>=1.11.0",

    # Type Stubs
    "types-redis>=4.6.0",

    # Pre-commit
    "pre-commit>=3.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["__tests__"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument
    "ARG002",  # unused method argument (common in abstract base classes)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "redis.*",
    "anthropic.*",
    "pinecone.*",
]
ignore_missing_imports = true
